
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tablero de formas</title>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
}

button {
    padding: 9px 16px;
    cursor: pointer;
}

/* =================================
   ZONA DE CREACIÓN DE FORMAS
================================= */

.zona-formas {
    display: flex;
    align-items: flex-start;
    gap: 30px;
    flex-wrap: wrap;
}

.panel-creacion {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.lista-formas {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 15px;
    overflow-x: auto;
    max-width: 700px;
    padding: 10px;
}

.forma-miniatura {
    flex-shrink: 0;
    border: 1px solid #aaa;
    padding: 8px;
    border-radius: 8px;
    background: #f5f5f5;
}

.forma-miniatura canvas {
    display: block;
}

/* =================================
   GRID 3D
================================= */

.grid-animado {
    display: grid;
    gap: 2px;
    padding: 10px;
    width: max-content;
}

.celda-3d {
    width: 50px;
    height: 50px;
    perspective: 300px;
    cursor: pointer;
}

.celda-interior {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
}

.cara {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border: 1px solid black;
    box-sizing: border-box;
}

.cara-frontal {
    background: lightgray;
}

.cara-trasera {
    transform: rotateX(180deg);
}

/* Animación de las casillas del resultado */

.celda-3d.revelar .celda-interior {
    animation: revelar 0.65s ease-in-out forwards;
}

@keyframes revelar {
    0% {
        transform: rotateX(0deg);
    }

    50% {
        transform: rotateX(90deg);
    }

    100% {
        transform: rotateX(180deg);
    }
}

/* Animación individual de las casillas editables */

.celda-interior.editable {
    transition: transform 0.65s ease-in-out;
}

/* Etiquetas */

.etiqueta-grid {
    width: 50px;
    height: 25px;
    text-align: center;
    font-size: 14px;
}

#estado_comparacion {
    margin-top: 20px;
}
</style>
</head>

<body>

<h2>Crear formas</h2>

<div class="zona-formas">

    <div class="panel-creacion">

        <div id="grid_formas" class="grid-animado"></div>

        <button id="añadir">Añadir forma</button>

    </div>

    <div>

        <h3>Formas creadas</h3>

        <div id="lista_formas" class="lista-formas"></div>

    </div>

</div>

<hr>

<h2>Tablero base / Resultado</h2>

<div id="grid_resultado" class="grid-animado"></div>

<br>

<button id="generar">Generar resultado</button>

<h3 id="estado_comparacion">
    Todavía no se ha generado ningún resultado.
</h3>

<audio class="music"
src="https://manzdev.github.io/codevember2017/assets/eye-tiger.mp3">
</audio>


<script>

// ==========================================
// CONFIGURACIÓN
// ==========================================

const tablero_base =
"x1nx2nx3nx4nx5nx6ny1 x1nx2nx3nx4nx5nx6ny2 x1nx2nx3nx4nx5nx6ny3 x1nx2nx3nx4nx5nx6ny4";

const lista_formas = [];

const contenedor_formas = document.getElementById("grid_formas");

const tamaño_celda = 50;
const margen_x = 40;
const margen_y = 30;


// ==========================================
// GENERAR RESULTADO ALEATORIO
// ==========================================

function generar_resultado(tablero_base) {

    return tablero_base.replace(/n/gi, () => {
        return Math.random() < 0.5 ? "t" : "f";
    });

}


// ==========================================
// GENERAR FORMA
// ==========================================

function generar_forma(tablero_base) {

    const columnas = tablero_base.trim().split(/\s+/);

    const forma = {
        columnas: []
    };

    let xReferencia = null;

    const ysUtilizadas = new Set();

    for (const columna of columnas) {

        const coincidencia = columna.match(
            /^((?:x\d+[ntf])+)(y\d+)$/
        );

        if (!coincidencia) {
            throw new Error("Formato incorrecto: " + columna);
        }

        const contenido = coincidencia[1];
        const y = coincidencia[2];

        if (ysUtilizadas.has(y)) {
            throw new Error("Columna duplicada: " + y);
        }

        ysUtilizadas.add(y);

        const expresion = /x(\d+)([ntf])/g;

        const celdas = {};
        const xActuales = [];

        let resultado;

        while ((resultado = expresion.exec(contenido)) !== null) {

            const x = "x" + resultado[1];
            const valor = resultado[2];

            if (Object.hasOwn(celdas, x)) {
                throw new Error("Casilla duplicada: " + x);
            }

            xActuales.push(x);

            celdas[x] = valor === "n" ? null : valor === "t";

        }

        if (xReferencia === null) {

            xReferencia = xActuales;

        } else if (
            JSON.stringify(xReferencia) !== JSON.stringify(xActuales)
        ) {

            throw new Error("Las columnas no tienen las mismas X");

        }

        forma.columnas.push({
            y: y,
            celdas: celdas
        });

    }

    return forma;
}


// ==========================================
// CAMBIAR CASILLA
// ==========================================

function cambiar_casilla(forma, y, x, valor) {

    const fila = forma.columnas.find(
        columna => columna.y === y
    );

    if (!fila || !(x in fila.celdas)) return;

    if (valor !== null && typeof valor !== "boolean") return;

    fila.celdas[x] = valor;

}


// ==========================================
// GENERAR CADENA
// ==========================================

function generar_cadena(forma) {

    return forma.columnas.map(columna => {

        let texto = "";

        for (const [x, valor] of Object.entries(columna.celdas)) {

            let caracter = "n";

            if (valor === true) caracter = "t";
            if (valor === false) caracter = "f";

            texto += x + caracter;
        }

        texto += columna.y;

        return texto;

    }).join(" ");

}


// ==========================================
// GENERAR REGEX
// ==========================================

function generar_regex(cadena) {

    const patron = cadena.replace(
        /(x\d+)([ntf])/g,
        (coincidencia, x, valor) => {

            if (valor === "t") {
                return x + "t";
            }

            return x + "[ntf]";
        }
    );

    return new RegExp("^" + patron + "$");
}


// ==========================================
// COMPARAR
// ==========================================

function comparar(resultado, lista_formas) {

    resultado = resultado.trim();

    const coincidencias = [];

    for (const forma of lista_formas) {

        const cadena_forma = generar_cadena(forma);

        const regex_forma = generar_regex(cadena_forma);

        if (regex_forma.test(resultado)) {
            coincidencias.push(forma);
        }

    }

    return coincidencias;
}


// ==========================================
// COLORES
// ==========================================

function obtener_color(valor) {

    if (valor === true) return "green";

    if (valor === false) return "red";

    return "lightgray";

}


// ==========================================
// DIBUJAR GRID CANVAS PARA MINIATURAS
// ==========================================

function dibujar_grid(canvas, ctx, forma) {

    const filas = forma.columnas;

    if (filas.length === 0) return;

    const xs = Object.keys(filas[0].celdas);

    const ancho = xs.length * tamaño_celda;
    const alto = filas.length * tamaño_celda;

    canvas.width = margen_x + ancho + 5;
    canvas.height = margen_y + alto + 5;

    ctx.font = "14px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    xs.forEach((x, i) => {

        ctx.fillStyle = "black";

        ctx.fillText(
            x,
            margen_x + i * tamaño_celda + tamaño_celda / 2,
            margen_y / 2
        );

    });

    filas.forEach((fila, yIndex) => {

        ctx.fillStyle = "black";

        ctx.fillText(
            fila.y,
            margen_x / 2,
            margen_y + yIndex * tamaño_celda + tamaño_celda / 2
        );

        xs.forEach((x, xIndex) => {

            const valor = fila.celdas[x];

            ctx.fillStyle = obtener_color(valor);

            const px = margen_x + xIndex * tamaño_celda;
            const py = margen_y + yIndex * tamaño_celda;

            ctx.fillRect(px, py, tamaño_celda, tamaño_celda);

            ctx.strokeStyle = "black";
            ctx.lineWidth = 1;

            ctx.strokeRect(px, py, tamaño_celda, tamaño_celda);

        });

    });

}


// ==========================================
// GRID 3D ANIMADO
// ==========================================

function crear_grid_animado(
    contenedor,
    forma,
    animar = false,
    editable = false
) {

    contenedor.innerHTML = "";

    const filas = forma.columnas;

    if (!filas.length) return;

    const xs = Object.keys(filas[0].celdas);

    contenedor.style.gridTemplateColumns =
        `40px repeat(${xs.length}, 50px)`;

    // Esquina vacía

    const esquina = document.createElement("div");

    contenedor.appendChild(esquina);


    // Etiquetas X

    xs.forEach(x => {

        const etiqueta = document.createElement("div");

        etiqueta.className = "etiqueta-grid";
        etiqueta.textContent = x;

        contenedor.appendChild(etiqueta);

    });


    // Filas

    filas.forEach((fila, yIndex) => {

        const etiquetaY = document.createElement("div");

        etiquetaY.className = "etiqueta-grid";
        etiquetaY.textContent = fila.y;

        contenedor.appendChild(etiquetaY);


        xs.forEach((x, xIndex) => {

            const valor = fila.celdas[x];

            const color = obtener_color(valor);

            // Contenedor de la casilla

            const celda = document.createElement("div");

            celda.className = "celda-3d";


            // Interior 3D

            const interior = document.createElement("div");

            interior.className = "celda-interior";


            // Cara frontal

            const frontal = document.createElement("div");

            frontal.className = "cara cara-frontal";


            // Cara trasera

            const trasera = document.createElement("div");

            trasera.className = "cara cara-trasera";


            // Configurar colores iniciales

            if (animar) {

                frontal.style.backgroundColor = "lightgray";
                trasera.style.backgroundColor = color;

            } else {

                frontal.style.backgroundColor = color;
                trasera.style.backgroundColor = color;

            }


            interior.appendChild(frontal);
            interior.appendChild(trasera);

            celda.appendChild(interior);

            contenedor.appendChild(celda);


            // ==================================
            // ANIMACIÓN DE RESULTADO
            // ==================================

            if (animar) {

                const retraso =
                    (yIndex * xs.length + xIndex) * 70;

                celda.style.animationDelay = retraso + "ms";

                celda.classList.add("revelar");

            }


            // ==================================
            // ANIMACIÓN DE CREACIÓN DE FORMAS
            // ==================================

            if (editable) {

                interior.classList.add("editable");

                // Ángulo actual de la casilla

                let angulo = 0;

                // Identificar la posición de la casilla

                celda.dataset.x = x;
                celda.dataset.y = fila.y;


                // Clic individual en cada casilla

                celda.addEventListener("click", () => {

                    const valor_actual = forma.columnas[yIndex].celdas[x];

                    // Ciclo: gris -> verde -> gris

                    const nuevo_valor =
                        valor_actual === true ? null : true;


                    // Actualizar el estado de la forma

                    cambiar_casilla(
                        forma,
                        fila.y,
                        x,
                        nuevo_valor
                    );


                    // Calcular el nuevo ángulo

                    angulo += 180;


                    // Color de la nueva cara visible

                    const nuevo_color = obtener_color(nuevo_valor);


                    // Determinar qué cara recibirá el nuevo color

                    if (angulo % 360 === 0) {

                        frontal.style.backgroundColor = nuevo_color;

                    } else {

                        trasera.style.backgroundColor = nuevo_color;

                    }


                    // Aplicar la rotación 3D individual

                    interior.style.transform =
                        `rotateX(${angulo}deg)`;


                    // Guardar el ángulo actual

                    celda.dataset.angulo = angulo;

                });

            }

        });

    });

}


// ==========================================
// ACTUALIZAR LISTA DE FORMAS
// ==========================================

function actualizar_lista_formas() {

    const contenedor = document.getElementById("lista_formas");

    contenedor.innerHTML = "";

    lista_formas.forEach((forma, index) => {

        const tarjeta = document.createElement("div");

        tarjeta.className = "forma-miniatura";

        const titulo = document.createElement("strong");

        titulo.textContent = `Forma ${index + 1}`;

        const canvas = document.createElement("canvas");

        const ctx = canvas.getContext("2d");

        dibujar_grid(canvas, ctx, forma);

        tarjeta.appendChild(titulo);
        tarjeta.appendChild(canvas);

        contenedor.appendChild(tarjeta);

    });

}


// ==========================================
// CREAR FORMA EDITABLE
// ==========================================

const forma_actual = generar_forma(tablero_base);

// Crear el grid 3D interactivo

crear_grid_animado(
    contenedor_formas,
    forma_actual,
    false,
    true
);


// ==========================================
// AÑADIR FORMA
// ==========================================

document.getElementById("añadir").addEventListener("click", () => {

    const copia = structuredClone(forma_actual);

    lista_formas.push(copia);

    actualizar_lista_formas();

    console.log("Forma añadida:", generar_cadena(copia));

});


// ==========================================
// MOSTRAR TABLERO BASE INICIAL
// ==========================================

const forma_tablero_base = generar_forma(tablero_base);

crear_grid_animado(
    document.getElementById("grid_resultado"),
    forma_tablero_base,
    false
);


// ==========================================
// GENERAR RESULTADO Y COMPARAR
// ==========================================

document.getElementById("generar").addEventListener("click", () => {

    const audio = document.querySelector(".music");


    // Generar resultado aleatorio

    const resultado = generar_resultado(tablero_base);


    // Convertir a forma

    const forma_resultado = generar_forma(resultado);


    // Mostrar animación 3D

    crear_grid_animado(
        document.getElementById("grid_resultado"),
        forma_resultado,
        true
    );


    // Comparar

    const coincidencias = comparar(resultado, lista_formas);

    const estado = document.getElementById("estado_comparacion");


    if (coincidencias.length > 0) {

        estado.textContent =
            "¡Coincidencia! Se encontraron " +
            coincidencias.length +
            " formas coincidentes.";

        audio.currentTime = 0;

        audio.play().catch(() => {});

        console.log("Coincidencias:", coincidencias);

    } else {

        estado.textContent =
            "No se encontró ninguna coincidencia.";

        console.log("No hay coincidencias.");

    }

    console.log("Resultado generado:", resultado);

});

</script>

</body>
</html>
